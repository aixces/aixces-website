<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIXCES | Your Creative Tech Partner</title>
<meta name="description" content="AIXCES is a one-stop branding and marketing partner for the real estate industry, from project launch to every sale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red: #F90B0A; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Montserrat', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 42%, rgba(249,11,10,0.22), transparent 70%),
      radial-gradient(ellipse 120% 60% at 50% 120%, rgba(249,11,10,0.10), transparent 60%),
      #000;
  }
  svg.ribbons {
    position: fixed; left: 0; width: 100%; top: 66%;
    transform: translateY(-50%);
    height: 70vh; z-index: 1; pointer-events: none;
    opacity: 0.85;
  }
  .ribbon { fill: none; stroke: var(--red); stroke-linecap: round; filter: url(#glow); }
  .r1 { stroke-width: 2.2; animation: drift 9s ease-in-out infinite alternate; }
  .r2 { stroke-width: 1.4; opacity: .7; animation: drift 11s ease-in-out infinite alternate-reverse; }
  .r3 { stroke-width: 0.9; opacity: .5; animation: drift 13s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateY(-14px); } to { transform: translateY(14px); } }

  main {
    position: relative; z-index: 2;
    text-align: center; padding: 24px;
    animation: fadeUp 1.6s ease-out both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .logo { width: min(340px, 68vw); height: auto; display: block; margin: 0 auto; }

  .tagline {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-top: 26px;
    font-weight: 300; font-size: clamp(11px, 1.6vw, 15px);
    letter-spacing: 0.42em; text-transform: uppercase; white-space: nowrap;
  }
  .tagline b { color: var(--red); font-weight: 500; }
  .hair { width: clamp(24px, 6vw, 60px); height: 2px; background: var(--red); flex-shrink: 0; opacity: .9; }

  .soon {
    margin-top: 56px;
    font-weight: 300; font-size: clamp(22px, 3.6vw, 36px);
    letter-spacing: 0.04em;
  }
  .soon b { color: var(--red); font-weight: 600; letter-spacing: 0.08em; }
  .sub {
    margin-top: 14px; color: rgba(255,255,255,0.6);
    font-weight: 300; font-size: clamp(13px, 1.7vw, 16px); line-height: 1.7;
  }

  .actions { margin-top: 40px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 26px; border-radius: 999px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none;
    transition: all .25s ease;
  }
  .btn-wa { background: var(--red); color: #fff; box-shadow: 0 0 28px rgba(249,11,10,0.35); }
  .btn-wa:hover { box-shadow: 0 0 42px rgba(249,11,10,0.6); transform: translateY(-1px); }
  .btn-mail { border: 1px solid rgba(255,255,255,0.35); color: #fff; }
  .btn-mail:hover { border-color: #fff; background: rgba(255,255,255,0.06); }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }

  footer {
    position: fixed; bottom: 22px; left: 0; right: 0; z-index: 2; text-align: center;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.35);
  }

  @media (max-width: 520px) {
    .tagline { letter-spacing: 0.24em; gap: 10px; }
    .soon { margin-top: 44px; }
    .actions { flex-direction: column; align-items: center; }
    .btn { width: 240px; justify-content: center; }
  }
</style>
</head>
